name: Build PS3i.a

on:
  workflow_dispatch:
    inputs:
      proxy_ip:
        description: "IP inicial do celular na rede (pode ser alterado dentro do app)"
        required: false
        default: "192.168.0.15"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/altps3/ps3dev:latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar ambiente e compilar
        env:
          PROXY_IP: ${{ inputs.proxy_ip }}
        run: |
          set -e
          export PS3DEV=${PS3DEV:-/usr/local/ps3dev}
          export PSL1GHT=${PSL1GHT:-$PS3DEV/psl1ght}
          [ -d "$PSL1GHT/ppu/include" ] || export PSL1GHT=$PS3DEV
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PSL1GHT/bin"

          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          test -f source/main.c

          APPID=CLAUDE001
          CONTENTID=UP0001-${APPID}_00-0000000000000000
          mkdir -p pkg/USRDIR

          # Icone inicial do aplicativo
          python3 - <<'PY'
          import struct, zlib
          w, h = 320, 176
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  glow = max(0, 70 - abs(x - 160) // 3 - abs(y - 88) // 2)
                  row.extend((8 + glow // 4, 28 + glow, 58 + glow * 2))
              rows.append(bytes(row))
          def chunk(kind, data):
              block = kind + data
              return struct.pack(">I", len(data)) + block + struct.pack(">I", zlib.crc32(block) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          with open("pkg/ICON0.PNG", "wb") as f:
              f.write(png)
          PY

          # Compilar o codigo real versionado em source/main.c
          ppu-gcc -O2 -Wall -mcpu=cell \
            -DPROXY_IP="\"${PROXY_IP}\"" \
            -I"$PSL1GHT/ppu/include" -I"$PS3DEV/portlibs/ppu/include" \
            source/main.c -o app.elf \
            -L"$PSL1GHT/ppu/lib" \
            -lnet -lrsx -lgcm_sys -lio -lsysutil -lsysmodule -lrt -llv2

          ppu-strip app.elf -o app_stripped.elf
          sprxlinker app_stripped.elf
          make_self_npdrm app_stripped.elf pkg/USRDIR/EBOOT.BIN "$CONTENTID"

          python3 "$PSL1GHT/bin/sfo.py" --title "PS3i.a" --appid "$APPID" \
            -f "$PSL1GHT/bin/sfo.xml" pkg/PARAM.SFO || \
            sfo.py --title "PS3i.a" --appid "$APPID" \
            -f "$PSL1GHT/bin/sfo.xml" pkg/PARAM.SFO

          python3 "$PSL1GHT/bin/pkg.py" --contentid "$CONTENTID" pkg/ ps3ia.pkg || \
            pkg.py --contentid "$CONTENTID" pkg/ ps3ia.pkg

          test -s ps3ia.pkg
          ls -lh ps3ia.pkg

      - name: Publicar pacote PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3ia-pkg
          path: ps3ia.pkg
          if-no-files-found: error
